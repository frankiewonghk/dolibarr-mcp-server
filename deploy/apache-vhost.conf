# Apache site for dolibarr-mcp-server. Replace mcp.example.com, save as
# /etc/apache2/sites-available/dolibarr-mcp.conf, then:
#   a2enmod proxy proxy_http headers ssl rewrite
#   a2ensite dolibarr-mcp && apachectl configtest && systemctl reload apache2
#   certbot --apache --redirect -d mcp.example.com
# certbot copies this site to an SSL site with the certificate and turns this
# one into a redirect to HTTPS. Sign-in must only ever run over HTTPS.

<VirtualHost *:80>
    ServerName mcp.example.com

    ProxyRequests Off
    ProxyPreserveHost On
    # flushpackets: MCP replies may be streamed, do not hold them back.
    ProxyPass        / http://127.0.0.1:3900/ flushpackets=on timeout=120
    ProxyPassReverse / http://127.0.0.1:3900/

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog  ${APACHE_LOG_DIR}/dolibarr_mcp_error.log
    CustomLog ${APACHE_LOG_DIR}/dolibarr_mcp_access.log "%h %l %u %t \"%m %U\" %>s %b %D"
</VirtualHost>
